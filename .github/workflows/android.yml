name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EBook-Reader-You.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EBook-Reader-You-APK
          path: EBook-Reader-You.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 EBook-Reader-You.apk --clobber
          else
            gh release create v0.1.0 EBook-Reader-You.apk --title "EBook Reader You v0.1.0" --notes "Initial full-suite Android reader build with EPUB, PDF, TXT, CBZ, and CBR support."
          fi
